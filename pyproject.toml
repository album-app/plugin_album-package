[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "album-package"
version = "0.6.0"
authors = [
    {name = "Deborah Schmidt", email = "mail@frauzufall.de"},
    {name = "Jan Philipp Albrecht", email = "album@jpalbrecht.de"},
    {name = "Lucas Rieckert", email = "lucas.rieckert@outlook.de"},
]
maintainers = [
    {name = "Deborah Schmidt", email = "mail@frauzufall.de"},
    {name = "Jan Philipp Albrecht", email = "album@jpalbrecht.de"},
    {name = "Lucas Rieckert", email = "lucas.rieckert@outlook.de"},
    {name = "Maximilian Otto", email = "maxotto45@gmail.com"},
]
description = "Album is a framework for unifying computational tools across frameworks, languages, and environments."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["virtual environments", "imaging", "data analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "album>=1.0.0,<2.0.0",
    "album-gui>=0.5.2,<0.6",
    "pyinstaller>=4.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ['*.txt']

[project.urls]
Documentation = "https://docs.album.solutions/en/latest/"
Homepage = "https://album.solutions/"
DeveloperDocumentation = "https://gitlab.com/album-app/album/-/wikis/home"
Repository = "https://gitlab.com/album-app/plugins/album-package"
Tracker= "https://gitlab.com/album-app/plugins/album-package/issues"

[project.entry-points."console_parsers_album"]
package="album.package.argument_parsing:create_executable_parser"
