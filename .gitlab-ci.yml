# templates
#----------------------------

# Windows base template
#
# Downloads micromamba executable in <current_working_directory>\downloads if executable not present.
# Installs micromamba in <current_working_directory>\micromamba if not already installed.
# Runs micromamba initialization and configuration.
#
# NOTE: Apparently there is no output for commands split over several lines...
.windows_base_template:
  before_script:
    - 'echo "We are in path: $pwd "'
    - 'if(-Not (Test-Path .\downloads)) {echo "Cache download not found! Creating..."; New-Item -ItemType Directory -Force -Path .\downloads} else { echo ".\downloads cache found! with content:"; Get-ChildItem -Path .\downloads}'
    - 'if(-Not (Test-Path .\.album)) {echo "Cache .album not found! Creating..."; New-Item -ItemType Directory -Force -Path .\.album} else { echo ".\.album cache found! with content:"; Get-ChildItem -Path .\.album}'
    - 'if(-Not (Test-Path .\micromamba)) {echo "Cache micromamba not found! Creating..."; New-Item -ItemType Directory -Force -Path .\micromamba} else { echo ".\micromamba cache found! with content:"; Get-ChildItem -Path .\micromamba}'
    - '$7ZIP_EXE=(Join-Path $env:ProgramFiles -ChildPath 7-Zip\7z.exe)'
    - '$7ZIP_INSTALLER=(Join-Path downloads -ChildPath 7z.exe)'
    - '$Env:USERPROFILE=$pwd'
    - '$oldProgressPreference = $progressPreference; $progressPreference = "SilentlyContinue";'
    - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12'                                                                                                                                                                                                                                                                                          # set Security download protocol to avoid https errors
    - 'if(-Not (Test-Path $7ZIP_EXE)) {if(-Not (Test-Path $7ZIP_INSTALLER)){Invoke-Webrequest -URI https://www.7-zip.org/a/7z2201-x64.exe -OutFile $7ZIP_INSTALLER}}'
    - 'if(-Not (Test-Path $7ZIP_EXE)) {Start-Process -FilePath $7ZIP_INSTALLER -Args "/S" -Verb RunAs -Wait}'
    - 'Invoke-Webrequest -URI https://micro.mamba.pm/api/micromamba/win-64/$env:MICROMAMBA_CI_VERSION -OutFile micromamba.tar.bz2'
    - '& $7ZIP_EXE x micromamba.tar.bz2 -aoa'
    - '& $7ZIP_EXE x micromamba.tar -ttar -aoa -r Library\bin\micromamba.exe $("-o" + (Join-Path -Path (Get-Location) -ChildPath micromamba_installation))'
    - '$progressPreference = $oldProgressPreference'
    - '.\micromamba_installation\Library\bin\micromamba.exe create -y -n album -c conda-forge python=$env:TEST_PYTHON_VERSION'
    - 'Write-Output "CI_COMMIT_REF_NAME: $env:CI_COMMIT_REF_NAME"'
    - 'Write-Output "ALBUM_DEV_PACKAGE: $env:ALBUM_DEV_PACKAGE"'
    - 'if($env:ALBUM_DEV_PACKAGE -match "True") { echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_PACKAGE GITLAB-RUNNER VARIABLE." }'
    # NOTE: The following requires a constraints file to be present in the repository at album-package/test_package/dev_mode_constraints.txt
    # NOTE: How do we handle release in conjunction with constraint files?
    - 'if (Test-Path (Join-Path $Env:CI_PROJECT_DIR "test_package\dev_mode_constraints.txt")) { Write-Output "Constraints file exists" } else { Write-Output "Constraints file does not exist" }'
    - 'if ($Env:ALBUM_DEV_PACKAGE -eq "True") { $Env:ALBUM_DEV_PACKAGE_CONSTRAINTS = "-c " + (Join-Path $Env:CI_PROJECT_DIR "test_package\dev_mode_constraints.txt") } else { $Env:ALBUM_DEV_PACKAGE_CONSTRAINTS = "" }'
    - 'Write-Output $Env:ALBUM_DEV_PACKAGE_CONSTRAINTS'
    # The variable is within the scope of the current job, so we can use it directly in the next command and enfore correct quoting when using "-c" for constraints.
    - 'if ($Env:ALBUM_DEV_PACKAGE -eq "True") { $ALBUM_DEV_PACKAGE_CONSTRAINTS_PATH = (Join-Path $Env:CI_PROJECT_DIR "test_package\dev_mode_constraints.txt") } else { $ALBUM_DEV_PACKAGE_CONSTRAINTS_PATH = "" }'
    - 'if ($Env:ALBUM_DEV_PACKAGE -eq "True") { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install --no-cache-dir $Env:CI_PROJECT_DIR -c $ALBUM_DEV_PACKAGE_CONSTRAINTS_PATH } else { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install --no-cache-dir $Env:CI_PROJECT_DIR }'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album python -V'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album pip list'
  tags:
    - windows
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR\.cache\pip
    ErrorActionPreference: Continue  # not working properly
  cache:
    key: one-key-to-rule-them-all-windows
    paths:
      - downloads
      - .cache\pip


# Linux base template for running tests with micromamba as package manager
#
# Uses a docker image where micromamba will be installed.
# Creates a album environment.
#

.linux_base_template:
  image: ubuntu:22.04
  tags:
    - docker
  before_script:
    - DEBIAN_FRONTEND=noninteractive apt update || (sleep 30 && apt update) && apt install -y --no-install-recommends ca-certificates curl bzip2 binutils tzdata libqt5core5a libqt5gui5
    - mkdir -p $CI_PROJECT_DIR/bin/
    - curl -fsSL --retry 5 --retry-delay 3 https://micro.mamba.pm/api/micromamba/linux-64/$MICROMAMBA_CI_VERSION -o /tmp/micromamba.tar.bz2
    - tar -xvjf /tmp/micromamba.tar.bz2 -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - MICROMAMBA_EXECUTABLE=$CI_PROJECT_DIR/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - $MICROMAMBA_EXECUTABLE create -y -n album python=$TEST_PYTHON_VERSION pip git -c conda-forge
    - echo $CI_COMMIT_REF_NAME
    - echo $ALBUM_DEV_PACKAGE
    - set -euo pipefail; [[ "${ALBUM_DEV_PACKAGE}" == "True" ]] && echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_PACKAGE GITLAB-RUNNER VARIABLE." || echo "ALBUM_DEV_PACKAGE not active"
    - set +e +u; set +o pipefail
    # NOTE: The following requires a constraints file to be present in the repository at album-package/test_package/dev_mode_constraints.txt
    # NOTE: How do we handle release in conjunction with constraint files?
    - if [ -f "$CI_PROJECT_DIR/test_package/dev_mode_constraints.txt" ]; then echo "Constraints file exists"; else echo "Constraints file does not exist"; fi
    - if [ "$ALBUM_DEV_PACKAGE" = "True" ]; then ALBUM_DEV_PACKAGE_CONSTRAINTS="-c $CI_PROJECT_DIR/test_package/dev_mode_constraints.txt"; else ALBUM_DEV_PACKAGE_CONSTRAINTS=""; fi
    - echo $ALBUM_DEV_PACKAGE_CONSTRAINTS
    # install album_packages
    - $MICROMAMBA_EXECUTABLE run -n album pip install --no-cache-dir $CI_PROJECT_DIR $ALBUM_DEV_PACKAGE_CONSTRAINTS
    - $MICROMAMBA_EXECUTABLE run -n album python -V
    - $MICROMAMBA_EXECUTABLE run -n album pip list
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - .cache/pip

# Macos base template for running tests with micromamba as package manager
#
# Installs micromamba in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template:
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - mkdir -p $tmpdir/bin/
    - curl -fsSL --retry 5 --retry-delay 3 https://micro.mamba.pm/api/micromamba/osx-64/$MICROMAMBA_CI_VERSION -o $tmpdir/micromamba.tar.bz2
    - tar -xvjf $tmpdir/micromamba.tar.bz2 -C $tmpdir/bin/ --strip-components=1 bin/micromamba
    - MICROMAMBA_EXECUTABLE=$tmpdir/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - $MICROMAMBA_EXECUTABLE create -y -n album python=$TEST_PYTHON_VERSION pip git -c conda-forge
    - echo $CI_COMMIT_REF_NAME
    - echo $ALBUM_DEV_PACKAGE
    - set -euo pipefail; [[ "${ALBUM_DEV_PACKAGE}" == "True" ]] && echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_PACKAGE GITLAB-RUNNER VARIABLE." || echo "ALBUM_DEV_PACKAGE not active"
    - set +e +u; set +o pipefail
    # NOTE: The following requires a constraints file to be present in the repository at album-package/test_package/dev_mode_constraints.txt
    - if [ -f "$CI_PROJECT_DIR/test_package/dev_mode_constraints.txt" ]; then echo "Constraints file exists"; else echo "Constraints file does not exist"; fi
    - if [ "$ALBUM_DEV_PACKAGE" = "True" ]; then ALBUM_DEV_PACKAGE_CONSTRAINTS="-c $CI_PROJECT_DIR/test_package/dev_mode_constraints.txt"; else ALBUM_DEV_PACKAGE_CONSTRAINTS=""; fi
    - echo $ALBUM_DEV_PACKAGE_CONSTRAINTS
    # install album_packages
    - $MICROMAMBA_EXECUTABLE run -n album pip install --no-cache-dir $CI_PROJECT_DIR $ALBUM_DEV_PACKAGE_CONSTRAINTS
    - $MICROMAMBA_EXECUTABLE run -n album python -V
    - $MICROMAMBA_EXECUTABLE run -n album pip list
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir


#----------------------------
# stages
#----------------------------

stages:
  - build
  - test
  - installer-build
  - release
  - deploy


#----------------------------
# jobs
#----------------------------

prepare release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  script:
    - echo "preparing release"
    - VERSION=$(cat pyproject.toml | grep "version=*" | awk '{gsub(/"/, "", $3); print $3}')
    - TAG=v$VERSION
    - echo "prepare to release version $VERSION with tag $TAG"
    - echo "VERSION=$VERSION" >> variables.env
    - echo "TAG=v$VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $ALBUM_DEV_PACKAGE == "True"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pyproject.toml

gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: prepare release
      artifacts: true
  script:
    - echo "running release_job for version $VERSION and tag $TAG"
  rules:
      - if: $ALBUM_DEV_PACKAGE == "True"
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - pyproject.toml
  release:
    name: 'Release $TAG'
    description: 'Created using the release-cli'
    tag_name: '$TAG'
    ref: '$CI_COMMIT_SHA'


gitlab pypi deploy:
  image: python:$TEST_PYTHON_VERSION
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  script:
    - echo "deploying gitlab pypi version $VERSION"
    - pip install twine build
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
      - if: $ALBUM_DEV_PACKAGE == "True"
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - pyproject.toml

pypi deploy:
  image: python:$TEST_PYTHON_VERSION
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  before_script:
    - echo "deploying pypi version $VERSION"
    - echo "using pypi deploy user $PYPI_DEPLOY_USER"
  script:
    - pip install twine build
    - python -m build
    - TWINE_PASSWORD=$PYPI_DEPLOY_TOKEN TWINE_USERNAME=$PYPI_DEPLOY_USER python -m twine upload --repository-url https://upload.pypi.org/legacy/  dist/*
  rules:
      - if: $ALBUM_DEV_PACKAGE == "True"
        when: never
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - pyproject.toml

cmdline linux:
  extends: .linux_base_template
  stage: build
  script:
    # album commands
    - $MICROMAMBA_EXECUTABLE run -n album album package -h
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"


unit tests linux:
  extends: .linux_base_template
