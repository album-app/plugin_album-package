# CI Routine for the album framework.

# Prevent duplicate pipelines: only run branch pipelines and cross-project triggers.
# Without this, GitLab creates BOTH a branch pipeline and a merge request pipeline
# for the same commit when an MR exists, doubling all jobs.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always


