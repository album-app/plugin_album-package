# CI Routine for the album framework.


#----------------------------
# templates
#----------------------------

# Windows base template
#
# Downloads conda executable in <current_working_directory>\downloads if executable not present.
# Installs conda in >current_working_directory>\miniconda if conda not already installed.
# Runs conda initialization and configuration.
#
# NOTE: Apparently there is no output for commands split over several lines...
.windows_base_template:
  before_script:
    - 'echo "We are in path: $pwd "'
    - 'if(-Not (Test-Path .\downloads)) {echo "Cache download not found! Creating..."; New-Item -ItemType Directory -Force -Path .\downloads} else { echo ".\downloads cache found! with content:"; Get-ChildItem -Path .\downloads}'
    - 'if(-Not (Test-Path .\.album)) {echo "Cache .album not found! Creating..."; New-Item -ItemType Directory -Force -Path .\.album} else { echo ".\.album cache found! with content:"; Get-ChildItem -Path .\.album}'
    - 'if(-Not (Test-Path .\micromamba)) {echo "Cache micromamba not found! Creating..."; New-Item -ItemType Directory -Force -Path .\micromamba} else { echo ".\micromamba cache found! with content:"; Get-ChildItem -Path .\micromamba}'
    - '$7ZIP_EXE=(Join-Path $env:ProgramFiles -ChildPath 7-Zip\7z.exe)'
    - '$7ZIP_INSTALLER=(Join-Path downloads -ChildPath 7z.exe)'
    - '$Env:MAMBA_ROOT_PREFIX=(Join-Path -Path (Get-Location) -ChildPath micromamba)'
    - '$Env:MAMBA_EXE=(Join-Path -Path (Get-Location) -ChildPath micromamba\Library\bin\micromamba.exe)'
    - '$Env:USERPROFILE=$pwd'
    - '$Env:ALBUM_CONDA_PATH=(Join-Path -Path ($CI_PROJECT_DIR) -ChildPath micromamba\Library\bin\micromamba.exe)'
    - '$oldProgressPreference = $progressPreference; $progressPreference = "SilentlyContinue";'
    - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12'                                                                                                                                                                                                                                                                                          # set Security download protocol to avoid https errors
    - 'if(-Not (Test-Path $7ZIP_EXE)) {if(-Not (Test-Path $7ZIP_INSTALLER)){Invoke-Webrequest -URI https://www.7-zip.org/a/7z2201-x64.exe -OutFile $7ZIP_INSTALLER}}'
    - 'if(-Not (Test-Path $7ZIP_EXE)) {Start-Process -FilePath $7ZIP_INSTALLER -Args "/S" -Verb RunAs -Wait}'
    - 'Invoke-Webrequest -URI https://micro.mamba.pm/api/micromamba/win-64/1.5.6 -OutFile micromamba.tar.bz2'
    - '& $7ZIP_EXE x micromamba.tar.bz2 -aoa'
    - '& $7ZIP_EXE x micromamba.tar -ttar -aoa -r Library\bin\micromamba.exe $("-o" + $Env:MAMBA_ROOT_PREFIX)'
    - '$progressPreference = $oldProgressPreference'
    - '.\micromamba\Library\bin\micromamba.exe create -y -n album -c conda-forge python=3.12'
    - '.\micromamba\Library\bin\micromamba.exe run -n album pip install --no-cache-dir $Env:CI_PROJECT_DIR'
    - '.\micromamba\Library\bin\micromamba.exe shell init -s powershell -p $Env:MAMBA_ROOT_PREFIX '

  tags:
    - windows
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR\.cache\pip
    ErrorActionPreference: Continue  # not working properly
  cache:
    key: one-key-to-rule-them-all-windows
    paths:
      - downloads
      - .cache\pip


# Linux base template for running tests with micromamba as package manager
#
# Uses a docker image where micromamba will be installed.
# Creates a album environment.
#

.linux_base_template:
  image: ubuntu:latest
  tags:
    - docker
  before_script:
    - apt update
    - apt install -y curl
    - apt install -y bzip2
    - apt-get update && apt-get install -y binutils libgl1-mesa-glx
    - export MAMBA_ROOT_PREFIX=$CI_PROJECT_DIR/micromamba
    - export ALBUM_CONDA_PATH=$CI_PROJECT_DIR/bin/micromamba
    - mkdir -p $CI_PROJECT_DIR/bin/
    - curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/1.5.6 | tar -xvj -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - eval "$($CI_PROJECT_DIR/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album -c conda-forge python=3.12 git
    - micromamba activate album
    - pip install --no-cache-dir $CI_PROJECT_DIR
    - python -V
    - pip list
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt
      - .cache/pip


# Macos base template for running tests with micromamba as package manager
#
# Installs micromamba in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template:
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - export MAMBA_ROOT_PREFIX=$tmpdir/micromamba
    - export ALBUM_CONDA_PATH=$tmpdir/bin/micromamba
    - mkdir -p $tmpdir/bin/
    - curl -Ls https://micro.mamba.pm/api/micromamba/osx-64/1.5.6 | tar -xvj -C $tmpdir/bin/ --strip-components=1 bin/micromamba
    - eval "$($tmpdir/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album -c conda-forge python=3.12 git
    - micromamba activate album
    - pip install --no-cache-dir $CI_PROJECT_DIR
    - python -V
    - pip list
#  after_script:
#    - tmpdir=$(</tmp/tmpdir)
#    - echo $tmpdir
#    - rm -rf $tmpdir


#----------------------------
# stages
#----------------------------

stages:
  - build
  - test
  - installer-build
  - release
  - deploy


#----------------------------
# jobs
#----------------------------

prepare release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  script:
    - echo "preparing release"
    - VERSION=$(cat setup.cfg | grep "version=*" | awk '{split($0, s, " "); print s[3]}')
    - TAG=v$VERSION
    - echo "prepare to release version $VERSION with tag $TAG"
    - echo "VERSION=$VERSION" >> variables.env
    - echo "TAG=v$VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: prepare release
      artifacts: true
  script:
    - echo "running release_job for version $VERSION and tag $TAG"
  rules:
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - setup.cfg
  release:
    name: 'Release $TAG'
    description: 'Created using the release-cli'
    tag_name: '$TAG'
    ref: '$CI_COMMIT_SHA'


gitlab pypi deploy:

  image: python:latest
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  script:
    - echo "deploying gitlab pypi version $VERSION"
    - pip install twine
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - setup.cfg

pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - DeployRunner
    - DeployDocker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  before_script:
    - echo "deploying pypi version $VERSION"
    - echo "using pypi deploy user $PYPI_DEPLOY_USER"
  script:
    - pip install twine
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=$PYPI_DEPLOY_TOKEN TWINE_USERNAME=$PYPI_DEPLOY_USER python -m twine upload --repository-url https://upload.pypi.org/legacy/  dist/*
  rules:
      - if: $CI_PIPELINE_SOURCE == "pipeline"
        when: never
      - if: $CI_COMMIT_TAG
        when: never
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        changes:
          - setup.cfg

cmdline linux:
  extends: .linux_base_template
  stage: build
  script:
    # album commands
    - album package -h
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"


unit tests linux:
  extends: .linux_base_template
  stage: test
  script:
    - ALBUM_CONDA_PATH=$CI_PROJECT_DIR/bin/micromamba python -m unittest test_package/unit/run_all_unit.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

integration tests linux:
  extends: .linux_base_template
  stage: test
  script:
    - python -m unittest test_package/integration/run_all_integration_micromamba.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

# MacOs Tests

unit tests macos arm64:
  extends: .macos_base_template
  stage: test
  script:
    - python -m unittest test_package/unit/run_all_unit.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

unit tests macos x86_64:
  extends: .macos_base_template
  stage: test
  script:
    - arch -x86_64 python -m unittest test_package/unit/run_all_unit.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

integration tests macos arm64:
  extends: .macos_base_template
  stage: test
  script:
    - python -m unittest test_package/integration/run_all_integration_micromamba.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

integration tests macos x86_64:
  extends: .macos_base_template
  stage: test
  script:
    - arch -x86_64 python -m unittest test_package/integration/run_all_integration_micromamba.py
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

# Windows Tests

unit tests windows:
  extends: .windows_base_template
  stage: test
  script:
    - $cmnd = powershell.exe -command {micromamba activate album 2>&1 | Write-Host; python -m unittest test_package\unit\run_all_unit.py 2>&1 | Write-Host; exit($lastexitcode)}
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"

integration tests windows:
  extends: .windows_base_template
  stage: test
  script:
    - $cmnd = powershell.exe -command {micromamba activate album 2>&1 | Write-Host; python -m unittest test_package\integration\run_all_integration_micromamba.py 2>&1 | Write-Host; exit($lastexitcode)}
  rules:
    - if: $CI_PIPELINE_SOURCE != "pipeline"


# Installer build jobs

linux_installer_build:
  extends: .linux_base_template
  stage: installer-build
  script:
    - album package --output_path $CI_PROJECT_DIR/installer
    - |
      if [ ! -f "$CI_PROJECT_DIR/installer/album_installer" ]; then
        echo "File not found!"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
      when: always
    - when: manual
  artifacts:
    expire_in: never
    paths:
      - $CI_PROJECT_DIR/installer/album_installer

macos_installer_build_arm64:
  extends: .macos_base_template
  stage: installer-build
  script:
    - echo "Building for Apple silicon (M1/arm64)..."
    - mkdir -p $CI_PROJECT_DIR/installer/arm64
    - album package --output_path $CI_PROJECT_DIR/installer/arm64
    - ls -lah $CI_PROJECT_DIR/installer/arm64
    - if [ ! -f "$CI_PROJECT_DIR/installer/arm64/album_installer.app" ]; then echo "Installer not found for arm64!" && exit 1; fi
  artifacts:
    expire_in: never
    paths:
      - $CI_PROJECT_DIR/installer/arm64
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
    - when: manual

macos_installer_build_x86_64:
  extends: .macos_base_template
  stage: installer-build
  script:
    - echo "Building for Intel x86-64 using Rosetta 2..."
    - mkdir -p $CI_PROJECT_DIR/installer/x86_64
    - arch -x86_64 album package --output_path $CI_PROJECT_DIR/installer/x86_64
    - ls -lah $CI_PROJECT_DIR/installer/x86_64
    - if [ ! -f "$CI_PROJECT_DIR/installer/x86_64/album_installer.app" ]; then echo "Installer not found for x86_64!" && exit 1; fi
  artifacts:
    expire_in: never
    paths:
      - $CI_PROJECT_DIR/installer/x86_64
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
    - when: manual

windows_installer_build:
  extends: .windows_base_template
  stage: installer-build
  script:
    - $cmnd = powershell.exe -command {micromamba activate album 2>&1 | Write-Host; album package --output_path $env:CI_PROJECT_DIR/installer 2>&1 | Write-Host; exit($lastexitcode)}
    - if (-Not (Test-Path $env:CI_PROJECT_DIR\installer\album_installer.exe -PathType Leaf)) { exit(1) }
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
      when: always
    - when: manual
  artifacts:
    expire_in: never
    paths:
      - $CI_PROJECT_DIR\installer\album_installer.exe
