# Installer build jobs
#
# Only the installers built on main are kept: the docs and the album-gui updater download
# jobs/artifacts/main/raw/...?job=<name>_installer_build, i.e. main's latest successful installer. On main the builds
# run in every pipeline once the tests passed, and the artifacts never expire. A failing build leaves the previous
# installer in place.
#
# On every other branch the same builds run automatically as <name>_installer_build_test, so a broken installer build
# fails the pipeline, and their artifacts expire after 1 day (GitLab does not allow a variable in artifacts:expire_in,
# hence the second job).

.installer_build_main_rules:
  rules:
    - if: $ALBUM_DEV_PACKAGE == "True"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  artifacts:
    expire_in: never

.installer_build_test_rules:
  rules:
    - if: $ALBUM_DEV_PACKAGE == "True"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  artifacts:
    expire_in: 1 day

.linux_installer_build:
  extends: .linux_base_template
  stage: installer-build
  needs: ["unit tests linux", "integration tests linux"]
  script:
    - $MICROMAMBA_EXECUTABLE run -n album album package --output_path $CI_PROJECT_DIR/installer
    - if [ ! -f "$CI_PROJECT_DIR/installer/album_installer" ]; then echo "Installer not found!" && exit 1; fi
  artifacts:
    paths:
      - $CI_PROJECT_DIR/installer/album_installer

linux_installer_build:
  extends: [.linux_installer_build, .installer_build_main_rules]

linux_installer_build_test:
  extends: [.linux_installer_build, .installer_build_test_rules]

.macos_installer_build_arm64:
  extends: .macos_base_template
  stage: installer-build
  needs: ["unit tests macos arm64", "integration tests macos arm64"]
  script:
    - echo "Building for Apple silicon (M1/arm64)..."
    - mkdir -p /Users/gitlab/builds/album-app/plugins/album-package/installer/arm64
    - $MICROMAMBA_EXECUTABLE run -n album album package --output_path /Users/gitlab/builds/album-app/plugins/album-package/installer/arm64
    - ls -lah /Users/gitlab/builds/album-app/plugins/album-package/installer/arm64
    - if [ ! -f "/Users/gitlab/builds/album-app/plugins/album-package/installer/arm64/album_installer.app" ]; then echo "Installer not found for arm64!" && exit 1; fi
  artifacts:
    paths:
      - /Users/gitlab/builds/album-app/plugins/album-package/installer/arm64/album_installer.app

macos_installer_build_arm64:
  extends: [.macos_installer_build_arm64, .installer_build_main_rules]

macos_installer_build_arm64_test:
  extends: [.macos_installer_build_arm64, .installer_build_test_rules]

.macos_installer_build_x86_64:
  extends: .macos_base_template
  stage: installer-build
  needs: ["unit tests macos x86_64", "integration tests macos x86_64"]
  script:
    - echo "Building for Intel x86-64 using Rosetta 2..."
    - mkdir -p /Users/gitlab/builds/album-app/plugins/album-package/installer/x86_64
    - arch -x86_64 $MICROMAMBA_EXECUTABLE run -n album album package --output_path /Users/gitlab/builds/album-app/plugins/album-package/installer/x86_64
    - ls -lah /Users/gitlab/builds/album-app/plugins/album-package/installer/x86_64
    - if [ ! -f "/Users/gitlab/builds/album-app/plugins/album-package/installer/x86_64/album_installer.app" ]; then echo "Installer not found for x86_64!" && exit 1; fi
  artifacts:
    paths:
      - /Users/gitlab/builds/album-app/plugins/album-package/installer/x86_64/album_installer.app

macos_installer_build_x86_64:
  extends: [.macos_installer_build_x86_64, .installer_build_main_rules]

macos_installer_build_x86_64_test:
  extends: [.macos_installer_build_x86_64, .installer_build_test_rules]

.windows_installer_build:
  extends: .windows_base_template
  stage: installer-build
  needs: ["unit tests windows", "integration tests windows"]
  script:
    - .\micromamba_installation\Library\bin\micromamba.exe run -n album album package --output_path $env:CI_PROJECT_DIR/installer
    - if (-Not (Test-Path $env:CI_PROJECT_DIR\installer\album_installer.exe -PathType Leaf)) { exit(1) }
  artifacts:
    paths:
      - $CI_PROJECT_DIR\installer\album_installer.exe

windows_installer_build:
  extends: [.windows_installer_build, .installer_build_main_rules]

windows_installer_build_test:
  extends: [.windows_installer_build, .installer_build_test_rules]
